/* V3 — refined dark northern aesthetic and readable battle strategy UI */
:root{--bg:#090d13;--panel:#111820;--panel2:#19222a;--line:#344249;--gold:#dab981;--gold2:#a98859;--ice:#9ac9c9}
body{background:radial-gradient(ellipse 950px 700px at 52% -200px,#244247 0%,transparent 75%),linear-gradient(115deg,#080e14,#111920 55%,#0b1219);letter-spacing:.06px}
.card{background:linear-gradient(150deg,#161e25fa,#10171ffa);box-shadow:0 22px 65px #0004}
.hero-banner{background:radial-gradient(ellipse 700px 270px at 78% 10%,#18515b69,transparent 80%),linear-gradient(120deg,#19272c,#0a1318 72%)}
.itempic{font-size:23px;filter:grayscale(.45) contrast(1.12);background:linear-gradient(150deg,#263840,#101a22);border-color:#47575d}
.char-art{background:radial-gradient(ellipse 250px 320px at 50% 40%,#294a527f,transparent 83%),linear-gradient(160deg,#172932,#0b141b);border-bottom:1px solid #354952}
.tactic-choice{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 13px}
.tactic-choice button{flex:1;min-width:130px}
.tactic-choice .selected{background:linear-gradient(130deg,#a78d62,#685034);color:#fff4dd;border-color:#f5d49b}
.power-comparison{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.power-comparison>div{border:1px solid #39525c;padding:12px;background:#122630;border-radius:10px}
.power-comparison span{display:block;color:#a7bdc2;font-size:11px}
.power-comparison strong{display:block;color:#e3c99f;font-size:22px;font-variant-numeric:tabular-nums}
.encounter{align-items:center;flex-wrap:wrap;gap:9px}.encounter .e-info{min-width:185px}
.chance-track{height:6px;border-radius:9px;background:#0a151c;overflow:hidden;margin:9px 0 5px;max-width:320px}.chance-track div{height:100%;background:linear-gradient(90deg,#b87c51,#a6d5c8);transition:width .2s}
.chance-readout strong{font-size:16px;color:#f1d4a0}
.academy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:17px}.academy-course{border:1px solid #38505b;background:linear-gradient(145deg,#1a2a32,#121e28);padding:16px;border-radius:12px}
.academy-course h3{font:700 19px Georgia,serif;padding:12px 0 6px}.academy-course p{font-size:12px;color:#a7bdc3;margin-bottom:13px}
.academy-exam{background:linear-gradient(145deg,#283b40,#14232b);border:1px solid #6c715d;border-radius:12px;margin-top:18px;padding:20px}.academy-exam h2{font-size:19px;line-height:1.4;margin:12px 0 16px}
@media(max-width:700px){.academy-grid{grid-template-columns:1fr}.power-comparison strong{font-size:18px}.encounter .e-info{min-width:170px}.encounter .enemy-icon{width:35px}.encounter button{margin-left:auto}}



/* NORTH STAR V4 — live, responsive UI with original photorealistic warrior artwork */
:root{--bg:#070c11;--gold:#e0bd7c;--ice:#9cd7e3;--panel:#101820;--line:#524a3d}
body{background:#090e13;color:#ebe8df}

.shell{max-width:1500px;padding:10px 14px 55px}

body.v4-playing .gamearea{margin-top:0}
.v4-game{position:relative;display:grid;grid-template-columns:minmax(215px,.74fr) minmax(360px,1.68fr) minmax(222px,.77fr);gap:10px;align-items:stretch}
.v4-balance{grid-column:1/-1;display:flex;gap:10px;align-items:center;justify-content:flex-end;min-height:40px}

.v4-side{padding:19px 14px}
.v4-side h2{font:700 28px/1.12 Georgia,serif;color:#f1e7d7}
.v4-side .v4-level{font:700 18px Georgia,serif;color:#d6ac69;margin-top:7px}

.v4-kit{padding:12px}

.v4-dock button.active{border-color:#f4ca81;color:#f6d5a1;background:linear-gradient(#5c4929,#241a15);box-shadow:inset 0 0 20px #d6a45041}
.v4-dock .dock-icon{display:block;font:23px/1.15 Georgia,serif;margin-bottom:4px}
.v4-content{grid-column:1/-1;padding-top:6px}

.v4-content .cardhead{background:#1a2424;border-color:#8c744d66}

function playerPowerXP(){const eq=Object.values(state.equipment||{}).filter(Boolean).reduce((s,id)=>s+(ITEMS[id]?.a||0)+(ITEMS[id]?.d||0),0);const learned=(state.learned||[]).reduce((s,id)=>s+(ACADEMY.find(l=>l.id===id)?.boost||0),0);return Math.floor(130*Math.pow(state.level,1.8)+(state.xp||0)*.09+eq*5+learned)}
function winChance(enemy){const ratio=playerPowerXP()/enemy.powerXP;if(ratio>=5)return 1;const core=1/(1+Math.exp(-2.5*Math.log(Math.max(.001,ratio))));const intent=(state.intents||{})[enemy.id]||'attack';const tactic=state.tactic||'strike';const odds=core/(1-core);const tacticalOdds=odds*(COUNTERS[intent]===tactic?1.6:.8);return Math.max(.002,Math.min(.995,tacticalOdds/(1+tacticalOdds)))}
function rewardExperience(enemy){const ratio=enemy.powerXP/Math.max(1,playerPowerXP());if(ratio<.18)return 0;return Math.max(1,Math.round(enemy.xpReward*Math.min(1.45,ratio)))}
function loot(enemy){const weak=playerPowerXP()>enemy.powerXP*3;const chance=enemy.dropChance*(weak?.1:1);if(rand(100000)>=Math.round(chance*100000))return null;const x=rand(1000);if(enemy.id==='wolf')return x<750?'rustknife':'tornbag';if(enemy.id==='raider')return x<600?'tornbag':x<950?'ragvest':'pack1';if(enemy.id==='draugr')return x<620?'ragvest':x<880?'boots':x<990?'leather':'axe';return x<470?'leather':x<810?'shield':x<945?'axe':x<995?'steel':'iceblade'}

function startLesson(id){const lesson=ACADEMY.find(l=>l.id===id);if(!lesson)return;if((state.learned||[]).includes(id))return;if(state.level<lesson.level){toast(B('notLevel'));return}if(!state.purchasedLessons.includes(id)){if(state.wallet<lesson.cost){toast(T('notEnough'));return}state.wallet-=lesson.cost;state.treasury+=lesson.cost;state.purchasedLessons.push(id);if(lesson.cost)ledger('Academy tuition: '+lesson.id,lesson.cost)}state.lesson={id,step:0,correct:0};save();render()}
function answerLesson(answer){const progress=state.lesson;if(!progress)return;const lesson=ACADEMY.find(l=>l.id===progress.id);if(!lesson)return;const q=lesson.questions[progress.step];if(!q)return;progress.correct+=Number(answer)===q.a?1:0;progress.step++;if(progress.step>=lesson.questions.length){if(progress.correct===lesson.questions.length){state.learned.push(lesson.id);log('✦ '+B('finished')+' '+(lesson.title[locale]||lesson.title.en));toast(B('finished'))}else{toast(B('retry'));log(B('retry'))}state.lesson=null}save();render()}
function schoolTab(){const active=state.lesson;let exam='';if(active){const lesson=ACADEMY.find(l=>l.id===active.id),q=lesson?.questions[active.step];if(q)exam=`<div class="academy-exam"><span class="eyebrow">${B('exam')} · ${active.step+1}/3</span><h2>${escapeHTML(q.q[locale]||q.q.en)}</h2><div class="tactic-choice">${(lesson.id==='tracker'?TRACKER_ANSWERS[locale]?.[active.step]||TRACKER_ANSWERS.en[active.step]:TACTICS.map(t=>B(TACTIC_NAMES[t]))).map((answer,i)=>`<button data-answer="${i}" class="academy-answer">${escapeHTML(answer)}</button>`).join('')}</div></div>`}return `<section class="card"><div class="cardhead"><h2>✧ ${B('school')}</h2><span class="tag">3 ${B('school')}</span></div><div class="pad"><p class="muted smalltext">${B('schoolIntro')}</p><div class="academy-grid">${ACADEMY.map(l=>{const done=state.learned.includes(l.id),locked=state.level<l.level;return `<div class="academy-course"><div class="eyebrow">✧ ${B('schoolLevel')} ${l.level}</div><h3>${escapeHTML(l.title[locale]||l.title.en)}</h3><p>+${l.boost} ${B('yourXP')} · ${B('tuition')}: ${l.cost} NSG</p><button data-lesson="${l.id}" class="small ${done?'':'primary'}" ${done||locked||!!active?'disabled':''}>${done?B('studied'):locked?B('locked'):B('learn')}</button></div>`}).join('')}</div>${exam}</div></section>`}

function claimContract(id){const c=CONTRACTS.find(x=>x.id===id);if(!c||state.level<c.level||state.contractClaims.includes(id)||(state.contractProgress[id]||0)<c.target)return;const reward=Math.min(state.treasury,c.reward);state.treasury-=reward;state.wallet+=reward;state.contractClaims.push(id);ledger('Contract: '+c.id,-reward);log('✦ '+B('quest')+' +'+reward+' NSG');save();render();toast('+'+reward+' NSG')}

function getItemName(id){return ITEMS[id]?ITEMS[id].name[locale]||ITEMS[id].name.en:id}function enemyName(e){return e.n[locale]||e.n.en}function stats(){let a=9+state.level*2,d=5+state.level;Object.values(state.equipment).forEach(id=>{if(ITEMS[id]){a+=ITEMS[id].a;d+=ITEMS[id].d}});return{a,d,hp:100+(state.level-1)*9}}function xpNeeded(){return Math.round(180+120*Math.pow(state.level,2.05))}

function fight(enemyid){const enemy=ENEMIES.find(x=>x.id===enemyid);if(!enemy)return;
const now=Date.now();if(now-(state.lastFight||0)<1250){toast(B('noSpam'));return}if(state.hp<=0){toast(T('lowHealth'));return}state.lastFight=now;
const p=winChance(enemy),won=rand(100000)<Math.round(p*100000),st=stats();state.fights++;
const hurt=Math.max(2,Math.round(enemy.atk*.65+rand(enemy.atk+4)-st.d*.45));state.hp=Math.max(won?1:0,state.hp-(won?Math.ceil(hurt*.42):hurt+3));
if(won){state.wins++;if(!state.contractClaims.includes(enemyid))state.contractProgress[enemyid]=(state.contractProgress[enemyid]||0)+1;const experience=rewardExperience(enemy);addXp(experience);
let gold=0;if(experience>0&&rand(10000)<Math.round(enemy.goldChance*10000))gold=enemy.goldMin+rand(enemy.goldMax-enemy.goldMin+1);
gold=Math.min(state.treasury,gold);state.treasury-=gold;state.wallet+=gold;if(gold)ledger('Monster bounty: '+enemy.n.en,-gold);
log('⚔ '+T('victory')+' '+enemyName(enemy)+' · +'+experience+' XP · +'+gold+' NSG · '+Math.round(p*100)+'%');

if(!experience)log(B('zeroRewards'));toast(T('win')+' +'+experience+' XP');
}else{log('⚔ '+T('defeat')+' '+enemyName(enemy)+' · '+Math.round(p*100)+'%');toast(B('battleLoss'))}

function equip(index){const itemid=state.inventory[index],it=ITEMS[itemid];if(!it)return;const old=state.equipment[it.slot];state.equipment[it.slot]=itemid;state.inventory.splice(index,1);if(old)state.inventory.push(old);state.hp=Math.min(state.hp,stats().hp);save();render();toast(T('equipped')+': '+getItemName(itemid))}
function unequip(slot){const current=state.equipment[slot];if(!current)return;state.equipment[slot]=null;state.inventory.push(current);state.hp=Math.min(state.hp,stats().hp);save();render();toast(T('takenOff'))}
function shopBuy(id){const it=ITEMS[id];if(!it||state.wallet<it.p||state.level<(it.minLvl||1)){toast(T('notEnough'));return}state.wallet-=it.p;state.treasury+=it.p;state.inventory.push(id);ledger('Forge purchase: '+it.name.en,it.p);save();render();toast(T('got')+': '+getItemName(id))}
function marketBuy(id){const listing=state.offers.find(x=>x.id===id&&x.stock>0);if(!listing){toast(T('missingStock'));return}if(state.wallet<listing.price){toast(T('notEnough'));return}const fee=Math.ceil(listing.price*.1),net=listing.price-fee;state.wallet-=listing.price;state.bots[listing.seller]+=net;state.treasury+=fee;listing.stock=0;state.inventory.push(listing.item);ledger('Market fee / 10%: '+ITEMS[listing.item].name.en,fee);log('◈ '+T('got')+': '+getItemName(listing.item));save();render();toast(T('got')+': '+getItemName(listing.item))}
function marketSell(index){const id=state.inventory[index],it=ITEMS[id];if(!it||!it.p)return;const price=Math.max(10,Math.round(it.p*.65)),buyer=state.bots.astrid>=price?'astrid':state.bots.ragnar>=price?'ragnar':null;if(!buyer){toast(T('noFunds'));return}const fee=Math.ceil(price*.1),net=price-fee;state.bots[buyer]-=price;state.wallet+=net;state.treasury+=fee;state.inventory.splice(index,1);ledger('Market fee / 10%: '+it.name.en,fee);log('◈ '+T('sold')+': '+getItemName(id)+' · +'+net+' NSG');save();render();toast(T('sold')+' +'+net+' NSG')}
function fakeEuro(){toast(B('demoWarn'))}

function startHTML(){return `<div class="intro card"><div class="cardhead"><h2>${T('startTitle')}</h2><span class="tag">✦ 01 / 03</span></div><div class="pad"><p class="muted">${T('startText')}</p><div class="create-options"><div class="choice"><label>${T('age')}</label><select id="age"><option value="young">${T('young')}</option><option value="middle">${T('middle')}</option><option value="old">${T('old')}</option></select></div><div class="choice"><label>${T('sex')}</label><select id="sex"><option value="male">${T('male')}</option><option value="female">${T('female')}</option></select></div></div><div class="info">✧ ${T('once')}</div><button class="primary" style="width:100%;padding:15px" data-do="generate">✦ ${T('generate')}</button></div></div>`}
function candidatesHTML(){return `<div class="intro card"><div class="cardhead"><h2>${T('selectTitle')}</h2><span class="tag">✦ 02 / 03</span></div><div class="pad"><p class="muted">${T('selectText')}</p><div class="info" style="margin-top:13px">✦ ${T('oneOnly')}</div><div class="candidates">${state.candidates.map((c,i)=>`<button class="candidate" data-pick="${i}"><span class="serial">№ 0${i+1}</span><div class="portrait">${avatar(c,{},'candidate'+i)}</div><strong>${escapeHTML(c.name)}</strong><div class="caption">${T('builds')[c.build]} • ${T(c.age)}</div><div style="padding:9px 0 3px;color:#e5c58d;font-weight:800;font-size:11px;letter-spacing:1px">${T('choose')} →</div></button>`).join('')}</div></div></div>`}
function unequipAll(){if(!state||state.phase!=='playing')return;let n=0;for(const slot of Object.keys(state.equipment)){const id=state.equipment[slot];if(id&&ITEMS[id]){state.inventory.push(id);state.equipment[slot]=null;n++}}if(n){save();render();toast('Varustus eemaldatud: '+n)}else toast('Kõik varustuse kohad on juba tühjad.')}
function equippedSlots(){const slots=['helm','cloak','chest','hands','belt','legs','boots','weapon','shield','pack','amulet'];return slots.map(k=>{
 const id=state.equipment[k],item=id?ITEMS[id]:null;
 return `<div class="eqslot ${id?'is-worn':'is-empty'}"><span class="slot-icon" aria-hidden="true">${item?item.icon:'◇'}</span><span>${slotName(k)}</span><strong>${item?escapeHTML(getItemName(id)):T('noItem')}</strong>${item?`<button class="small ghost" data-unequip="${k}">${T('unequip')} ✕</button>`:''}</div>`;
 }).join('')}
function itemRows(ids,mode){if(!ids.length)return `<div class="notice">${T('empty')}</div>`;return ids.map((id,i)=>{const it=ITEMS[id],rare=it.rarity?'rarity-'+it.rarity:'';let buttons=mode==='inv'?`<button class="primary small" data-equip="${i}">${T('equip')}</button>`:mode==='sell'?`<button class="small" data-sell="${i}" ${!it.p||it.p<=2?'disabled':''}>${T('sell')} · ${Math.max(0,Math.round(it.p*.65)-Math.ceil(Math.round(it.p*.65)*.1))} NSG</button>`:`<button class="primary small" data-shop="${id}" ${state.wallet<it.p||state.level<(it.minLvl||1)?'disabled':''}>${T('buy')} · ${it.p}${it.minLvl?' · LV '+it.minLvl:''}</button>`;return `<div class="item"><div class="itempic">${it.icon}</div><div class="itemmain"><b class="${rare}">${escapeHTML(getItemName(id))}</b><small>${T(it.slot)} · ⚔ +${it.a} · 🛡 +${it.d}</small></div><div class="actions">${buttons}</div></div>`}).join('')}
function homeTab(){return `<section class="card"><div class="cardhead"><h2>${T('welcome')}</h2><span class="tag">NORTH STAR</span></div><div class="pad"><p class="muted" style="margin-bottom:17px">${T('welcomeText')}</p><div class="two"><div class="feature"><em>✦</em><h3>${T('treasure')}</h3><p><b style="color:#efd398">${fmt(TOTAL)} NSG</b><br>${T('fixed')}</p></div><div class="feature"><em>⚖</em><h3>${T('marketFee')} · 10%</h3><p>${T('feeText')}</p></div></div><div class="rule"></div><h3 style="margin:0 0 10px">${T('equipment')}</h3><div class="equipment">${equippedSlots()}</div><div class="info" style="margin-top:16px">✦ ${T('ageInfo')}</div></div></section>`}
function inventoryTab(){return `<div class="tabsplit"><section class="card"><div class="cardhead"><h2>${T('inventory')}</h2><span class="tag">${state.inventory.length}</span></div><div class="pad"><p class="muted smalltext" style="margin-bottom:14px">${T('invText')}</p><div class="items">${itemRows(state.inventory,'inv')}</div></div></section><section class="card"><div class="cardhead"><h2>${T('equipment')}</h2></div><div class="pad"><div class="equipment">${equippedSlots()}</div></div></section></div>`}
function battleTab(){return `<div class="tabsplit"><section class="card"><div class="cardhead"><h2>${T('combat')}</h2><span class="tag">PVE · V5</span></div><div class="pad"><p class="muted smalltext">${B('battleTip')}</p><div class="power-comparison"><div><span>${B('yourXP')}</span><strong>${fmt(playerPowerXP())}</strong></div><div><span>${B('academyBonus')}</span><strong>${state.learned.length}</strong></div></div><h3 style="margin:17px 0 7px">${B('choiceHint')}</h3><div class="tactic-choice">${TACTICS.map(t=>`<button class="tactic ${state.tactic===t?'selected':''}" data-tactic="${t}">${t==='strike'?'⚔':t==='counter'?'⛨':'✧'} ${B(TACTIC_NAMES[t])}</button>`).join('')}</div>${ENEMIES.map(e=>{const prob=winChance(e),chance=prob===1?100:Math.round(prob*1000)/10,intent=state.intents[e.id]||'attack',xp=rewardExperience(e);return `<div class="enemy encounter"><span class="enemy-icon">${e.icon}</span><div class="e-info"><b>${escapeHTML(enemyName(e))}</b><small>${T('level')} ${e.lvl} · ${B('monsterXP')}: <strong>${fmt(e.powerXP)}</strong></small><small>${B('intent')}: ${B(INTENT_NAMES[intent])} · ${xp} XP ${B('possibleXp')}</small><div class="chance-track"><div style="width:${chance}%"></div></div><small class="chance-readout ${chance<35?'dangertext':chance>80?'pale':''}">${B('winChance')}: <strong>${chance}%</strong></small></div><button class="primary small" data-fight="${e.id}" ${state.hp<=0?'disabled':''}>${T('fight')}</button></div>`}).join('')}<div class="tactic-choice"><button class="secondary" data-do="camp">♡ ${B('freeCamp')}</button><button class="secondary" data-do="rest">♡ ${B('restPrice')} · 8 NSG</button></div></div></section><section class="card"><div class="cardhead"><h2>${T('log')}</h2></div><div class="pad">${state.logs.slice(0,9).map(l=>`<div class="log">${escapeHTML(l)}</div>`).join('')}<div class="info">${B('battleTip')}</div></div></section></div>`}
function shopTab(){const stock=['sword','axe','iceblade','leather','steel','runearmor','pack1','pack2','helmet','crown','boots','shield','amulet','linenpants','leatherpants','gloves','woolcloak','furcloak','belt'];return `<section class="card"><div class="cardhead"><h2>${T('shop')}</h2><span class="money">◈ ${fmt(state.wallet)} NSG</span></div><div class="pad"><p class="muted smalltext" style="margin-bottom:15px">${T('shopText')}</p><div class="items">${itemRows(stock,'shop')}</div></div></section>`}
function marketTab(){return `<div class="tabsplit"><section class="card"><div class="cardhead"><h2>${T('otherListings')}</h2><span class="tag">10%</span></div><div class="pad"><p class="muted smalltext">${T('marketText')}</p>${state.offers.filter(o=>o.stock).map(o=>{const it=ITEMS[o.item];return `<div class="item" style="margin-top:11px"><div class="itempic">${it.icon}</div><div class="itemmain"><b>${escapeHTML(getItemName(o.item))}</b><small>${o.seller==='astrid'?'Astrid':'Ragnar'} · ${o.price} NSG · 10% ⌂</small></div><button class="small primary" data-market-buy="${o.id}" ${state.wallet<o.price?'disabled':''}>${T('buy')}</button></div>`}).join('')||`<div class="notice">${T('empty')}</div>`}<div class="info" style="margin-top:12px">${T('marketNotice')}</div></div></section><section class="card"><div class="cardhead"><h2>${T('marketSell')}</h2></div><div class="pad"><div class="items">${itemRows(state.inventory,'sell')}</div></div></section></div>`}
function economyTab(){let audit=assertSupply();return `<div class="tabsplit"><section class="card"><div class="cardhead"><h2>${T('treasury')}</h2><span class="tag">FIXED SUPPLY</span></div><div class="pad"><p class="muted smalltext">${T('econText')}</p><div class="total"><span>${T('supplyLabel')}</span><b>${fmt(TOTAL)}</b><span>NSG</span></div><div class="statrow"><span class="muted">◈ ${T('treasuryLabel')}</span><strong>${fmt(state.treasury)} NSG</strong></div><div class="statrow"><span class="muted">♙ ${T('playerLabel')}</span><strong>${fmt(state.wallet)} NSG</strong></div><div class="statrow"><span class="muted">♟ ${T('othersLabel')}</span><strong>${fmt(state.bots.astrid+state.bots.ragnar)} NSG</strong></div><p class="smalltext ${audit?'pale':'dangertext'}">${audit?'✓ '+T('supplyOK'):'⚠ Currency balance mismatch'}</p><div class="rule"></div><div class="info">${B('demoWarn')} ${T('currencyMock')}</div></div></section><section class="card"><div class="cardhead"><h2>${T('history')}</h2></div><div class="pad">${state.ledger.slice(0,11).map(o=>`<div class="ledger"><span>${escapeHTML(o.note)}</span><strong>${o.amt>=0?'+':''}${o.amt} NSG</strong></div>`).join('')}<div class="rule"></div><p class="muted smalltext">${T('guardText')}</p></div></section></div>`}
function gameHTML(){
 const st=stats();if(state.hp>st.hp)state.hp=st.hp;
 const tabs=['home','combat','quest','school','inventory','shop','market','treasury'];
 const panels={home:homeTab,combat:battleTab,quest:questTab,school:schoolTab,inventory:inventoryTab,shop:shopTab,market:marketTab,treasury:economyTab};
 const glyphs={home:'♙',combat:'⚔',quest:'▤',school:'⚒',inventory:'▣',shop:'⚒',market:'◈',treasury:'✦'};
 return `<div class="gamearea v4-game">
 <div class="v4-balance"><span class="lvl">✦ ${T('level')} ${state.level}</span><span class="money">◈ ${fmt(state.wallet)} NSG</span></div>
 <aside class="v4-side"><h2>${escapeHTML(state.hero.name)}</h2><div class="v4-level">${T('level')} ${state.level}</div>
 <div class="v4-xp"><div class="bar xp"><span style="width:${Math.round(state.xp/xpNeeded()*100)}%"></span></div><small>${T('experience')}: ${fmt(state.xp)} / ${fmt(xpNeeded())}</small></div>
 <p class="v4-creation-note">${T('role')} · ${T('builds')[state.hero.build]}</p>
 <div class="v4-stat-label">${T('profile')}</div>
 <div class="v4-measures"><div class="statrow"><span>⚔ ${T('attack')}</span><b>${st.a}</b></div><div class="statrow"><span>⛨ ${T('defense')}</span><b>${st.d}</b></div><div class="statrow"><span>♥ ${T('health')}</span><b>${state.hp}/${st.hp}</b></div><div class="statrow"><span>✧ ${T('speed')}</span><b>${12+state.level}</b></div><div class="statrow"><span>${B('yourXP')}</span><b>${fmt(playerPowerXP())}</b></div></div>
 <div class="v4-perk">✦ ${T('ageInfo')}</div></aside>
 <section class="v4-scene" aria-label="Warrior portrait and northern landscape">
 <div class="v4-figure v4-paperdoll">${avatar(state.hero,state.equipment,'mainhero')}</div>
 <div class="v4-hero-head"><span class="v4-badge">NORTH STAR · V5</span></div>
 <div class="v4-scene-foot"><span>♥ ${state.hp} / ${st.hp}</span><span>⚔ ${fmt(playerPowerXP())} XP</span></div>
 </section>
 <aside class="v4-kit"><h3>${T('equipment')}</h3><div class="equipment">${equippedSlots()}</div><button type="button" class="small ghost v5-unequip-all" data-do="unequipAll">✕ ${locale==='et'?'Eemalda kõik':locale==='en'?'Remove all':locale==='de'?'Alles ablegen':'Poista kaikki'}</button></aside>
 <nav class="v4-dock nav" aria-label="Game navigation">${tabs.map(k=>`<button data-tab="${k}" class="${stageTab===k?'active':''}"><span class="dock-icon">${glyphs[k]}</span>${k==='school'?B('school'):k==='quest'?B('quest'):T(k)}</button>`).join('')}</nav>
 <div class="v4-content" id="tabContent">${panels[stageTab]()}</div>
 <p class="v4-visual-note">V5 mängitav varustuseproov: baastegelasel ei ole püsivat varustust. Kõik riided, jalatsid, relvad, kilp, kott ja ehted ilmuvad ainult vastava eseme kandmisel. Realistliku lõppgraafika loomine jätkub.</p>
 </div>`;
}

function render(){document.body.classList.toggle('v4-playing',state.phase==='playing');document.documentElement.lang=locale;$('lang').value=locale;$('subtitle').textContent=T('subtitle');$('tagline').textContent=T('tagline');$('app').innerHTML=state.phase==='setup'?startHTML():state.phase==='choose'?candidatesHTML():gameHTML();if(state.phase==='setup'){$('age').value=age;$('sex').value=sex}}
$('lang').addEventListener('change',e=>{locale=e.target.value;localStorage.setItem('ns-locale',locale);render()});
$('app').addEventListener('change',e=>{if(e.target.id==='age')age=e.target.value;if(e.target.id==='sex')sex=e.target.value});
$('app').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.do==='generate')genCandidates();else if(d.pick!==undefined)selectHero(Number(d.pick));else if(state.phase!=='playing')return;else if(d.tab){stageTab=d.tab;render()}else if(d.tactic){state.tactic=d.tactic;save();render()}else if(d.fight)fight(d.fight);else if(d.do==='camp')heal(true);else if(d.do==='rest')heal();else if(d.do==='unequipAll')unequipAll();else if(d.lesson)startLesson(d.lesson);else if(d.contract)claimContract(d.contract);else if(d.answer!==undefined)answerLesson(Number(d.answer));else if(d.equip!==undefined)equip(Number(d.equip));else if(d.unequip)unequip(d.unequip);else if(d.shop)shopBuy(d.shop);else if(d.marketBuy!==undefined)marketBuy(Number(d.marketBuy));else if(d.sell!==undefined)marketSell(Number(d.sell));});
migrateBalance();
render();
})();
</script>
</body>
</html>
